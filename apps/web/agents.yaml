# Cards do dashboard. O status vem daqui e do registro de ferramentas:
# um agente só aparece como disponível se o YAML de ferramenta existir de fato.
# Nenhuma integração é simulada (CLAUDE.md, regra 4: quem conhece o roteamento
# é o REGISTRY — ver agents/diretor-operacoes/REGISTRY.md).
agents:
  - nome: "Diretor de Operações"
    capability: "orquestração"
    resumo: "Entende a demanda, roteia por capability e monta os jobs dos especialistas."
    tool: null
    nota: "Precisa de runtime de inteligência (Etapa 2)."

  - nome: "LP Builder"
    capability: "lp.arquitetura · lp.qa · lp.publicacao"
    resumo: "Constrói, audita e publica Landing Page com preview versionado."
    tool: null
    nota: "Os motores de QA e publicação já são determinísticos — próximos da fila."

  - nome: "Design IA"
    capability: "design.peca_grafica"
    resumo: "Direção de arte e peça gráfica renderizada, revisada antes de entregar."
    tool: null
    nota: "O render é determinístico; a direção de arte precisa da Etapa 2."

  - nome: "Revisor de Arte"
    capability: "revisao.visual"
    resumo: "Compara o que foi pedido com o que foi entregue e devolve parecer."
    tool: null
    nota: "A medição técnica de vídeo é determinística; o parecer precisa da Etapa 2."

  - nome: "Legend IA"
    capability: "video.edicao"
    resumo: "Transcreve o áudio, queima legendas, headline e CTA no vídeo."
    tool: "legend.editar"
    nota: null

  - nome: "Copywriter"
    capability: "copywriting.*"
    resumo: "Roteiro, social, Meta Ads e copy de Landing Page."
    tool: null
    nota: "Prompt puro — depende inteiramente da Etapa 2."
